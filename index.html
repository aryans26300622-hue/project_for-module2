<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensScape - High-Resolution Visual Search</title>
    <!-- Stylesheet Link -->
    <link rel="stylesheet" href="styles(2).css">
    <!-- FontAwesome Icons for UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- This is for Assignment -->

    <!-- Sticky Header -->
    <header class="sticky-header">
        <div class="header-container">
            <div class="brand">
                <i class="fa-solid fa-camera-retro brand-icon"></i>
                <div class="brand-text">
                    <h1 class="app-title">LensScape</h1>
                    <p class="tagline">Discover stunning high-resolution visuals instantly.</p>
                </div>
            </div>

            <!-- Search Form -->
            <form id="search-form" class="search-box">
                <label for="search-input" class="sr-only">Search images</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search photos, themes, vectors..." 
                        autocomplete="off"
                    >
                    <button type="button" id="clear-btn" class="clear-btn hidden" aria-label="Clear search input">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <button type="submit" id="search-btn" class="btn-primary">
                    <span>Search</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Category Chips Bar -->
        <div class="categories-bar">
            <span class="categories-label">Popular:</span>
            <div class="chips-row">
                <button class="chip" data-tag="Nature">Nature</button>
                <button class="chip" data-tag="Architecture">Architecture</button>
                <button class="chip" data-tag="Cyberpunk">Cyberpunk</button>
                <button class="chip" data-tag="Wildlife">Wildlife</button>
                <button class="chip" data-tag="Drone Visuals">Drone Visuals</button>
                <button class="chip" data-tag="Minimalism">Minimalism</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-container">
        <!-- Results Info Bar -->
        <div class="results-meta">
            <h2 id="results-count">Showing 0 results</h2>
        </div>

        <!-- Results Grid Container -->
        <div id="results-container" class="results-grid">
            <!-- Empty State Placeholder -->
            <div id="empty-state" class="empty-state-card">
                <div class="empty-icon-wrapper">
                    <i class="fa-solid fa-images"></i>
                </div>
                <h3>Start Exploring LensScape</h3>
                <p>Type a search term above or select a popular category chip to discover high-resolution images.</p>
            </div>
        </div>
    </main>

    <!-- Application Script Link -->
    <script src="script.js"></script>
</body>
</html>
